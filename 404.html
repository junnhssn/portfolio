<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Saranyaa Ramesh</title>
<meta name="robots" content="noindex">

<!-- Absolute paths: GitHub Pages serves this file for any unknown URL, at any
     depth, so relative paths would break. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%235a3e91'/%3E%3Ctext x='50' y='73' font-family='Georgia,serif' font-size='64' font-style='italic' fill='%23f7f6fb' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/portfolio/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Keep the font request and the ?v= tag in step with index.html, so this
     page shares the main site's cached files and never serves stale CSS. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..700;1,62..125,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/portfolio/assets/styles.css?v=20261013b">

<style>
  .nf { min-height: 100dvh; display: grid; place-content: center; text-align: left; padding: clamp(1.5rem, 6vw, 4rem); }
  .nf .dsplit { margin-bottom: 1.25rem; }
  .nf p { max-width: 46ch; color: var(--text-muted); }
  .nf .hero-cta { margin-top: 2rem; }
</style>
</head>

<body>
  <main class="nf">
    <p class="eyebrow">Error 404</p>
    <h1 class="dsplit">
      <span class="dsplit-a">Page not</span>
      <span class="dsplit-b">Found</span>
    </h1>
    <p>That link does not lead anywhere. It may have been a case study that moved, or a typo in the address.</p>
    <div class="hero-cta">
      <a class="pill pill--solid" href="/portfolio/">Back to the portfolio</a>
      <a class="pill" href="/portfolio/#work">Selected work</a>
      <a class="pill" href="/portfolio/#contact">Get in touch</a>
    </div>
  </main>

  <script>
    // Match whatever theme the visitor last chose on the main site.
    try {
      var t = localStorage.getItem('sr_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    } catch (e) { /* private mode, keep the default */ }
  </script>
</body>
</html>
